<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon espace · Te Ora Hau</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://alaesbkvfprgpngrowbt.supabase.co" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .bonjour { margin-bottom:0.3rem; font-size:1.6rem; color:var(--bleu-fonce); }
    .statut { color:var(--gris); font-size:0.95rem; margin-bottom:1.4rem; }
    .statut .pastille { display:inline-block; padding:0.18rem 0.7rem; border-radius:999px;
                        font-size:0.8rem; font-weight:700; margin-right:0.4rem; }
    .pastille.ok { background:#e3f5ea; color:#1d6b3f; }
    .pastille.ko { background:#fce6e1; color:#b2381f; }
    .pastille.bureau { background:#e8e3f5; color:#534ab7; }

    /* « À faire » : ce que le site attend de vous, avant tout le reste */
    .afaire { background:#fff8ef; border:1px solid #f0d9a8; border-radius:12px;
              padding:1rem 1.1rem; margin-bottom:1.6rem; }
    .afaire h2 { font-size:1rem; color:#8a5a00; margin:0 0 0.7rem; }
    .afaire li { list-style:none; display:flex; gap:0.8rem; align-items:center;
                 flex-wrap:wrap; padding:0.45rem 0; border-top:1px solid #f0e2c4; }
    .afaire li:first-of-type { border-top:none; }
    .afaire .txt { flex:1 1 240px; font-size:0.9rem; }
    .afaire ul { margin:0; padding:0; }
    .afaire.urgent { background:#fce6e1; border-color:#f3c2b6; }
    .afaire.urgent h2 { color:#b2381f; }

    /* Les actions : de gros boutons, pas des menus */
    .actions { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
               gap:0.9rem; margin-bottom:1.8rem; }
    .action { display:flex; gap:0.85rem; align-items:flex-start; text-decoration:none;
              background:var(--blanc); border-radius:14px; box-shadow:var(--ombre);
              padding:1rem 1.1rem; color:var(--texte); border-top:4px solid var(--bleu-lagon);
              transition:transform 0.12s ease, box-shadow 0.15s ease; }
    .action:hover { text-decoration:none; transform:translateY(-2px);
                    box-shadow:0 8px 22px rgba(6,74,84,0.16); }
    .action:focus-visible { outline:3px solid var(--bleu-lagon); outline-offset:2px; }
    .action .ico { font-size:1.5rem; line-height:1; }
    .action b { display:block; color:var(--bleu-fonce); font-size:1rem; margin-bottom:0.15rem; }
    .action span { font-size:0.82rem; color:var(--gris); line-height:1.4; }
    .action.signaler { border-top-color:var(--corail); }
    .action.bureau   { border-top-color:#534ab7; }
    .action.verrou   { opacity:0.6; }

    .carte-membre { background:linear-gradient(135deg,var(--bleu-fonce),var(--bleu-lagon));
                    color:#fff; border-radius:18px; padding:1.4rem 1.5rem; box-shadow:var(--ombre); }
    .carte-membre .ligne { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
    .carte-membre h3 { font-size:1.2rem; margin:0; }
    .carte-membre .label { font-size:0.7rem; opacity:0.85; text-transform:uppercase; letter-spacing:1px; }
    .carte-membre .val { font-size:0.95rem; font-weight:600; }
    .carte-membre .infos { display:flex; gap:1.6rem; margin-top:1rem; flex-wrap:wrap; align-items:flex-end; }
    #qr { background:#fff; padding:7px; border-radius:9px; width:fit-content; }

    .annonce { background:var(--blanc); border-radius:12px; box-shadow:var(--ombre);
               border-left:4px solid var(--bleu-lagon); padding:1rem 1.2rem; margin-bottom:0.9rem; }
    .annonce h4 { color:var(--bleu-fonce); font-size:1.05rem; margin:0 0 0.4rem; }
    .annonce .corps { white-space:pre-wrap; line-height:1.55; }
    .annonce .date { font-size:0.78rem; color:var(--gris); margin-top:0.6rem; }
    .annonce .evt { color:var(--corail); font-weight:700; margin-bottom:0.3rem; }
    @keyframes clignote-annonce { 0%,100%{box-shadow:var(--ombre);} 50%{box-shadow:0 0 0 3px rgba(255,122,89,0.55),var(--ombre);} }
    .annonce.urgent { border-left-color:var(--corail); animation:clignote-annonce 1.2s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce){ .annonce.urgent{ animation:none; box-shadow:0 0 0 3px rgba(255,122,89,0.5),var(--ombre);} }

    .titre-bloc { font-size:1.05rem; color:var(--bleu-fonce); margin:0 0 0.8rem; }
    .discret { font-size:0.85rem; color:var(--gris); }
  </style>
</head>
<body>
  <div id="nav-mount"></div>
  <main id="contenu"><p class="discret">Chargement…</p></main>
  <div id="footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async function () {
      await initPage("espace");
      const contenu = document.getElementById("contenu");
      const profil = await monProfil();
      if (!profil) { contenu.innerHTML = verrouAcces(null); return; }

      // Informations mémorisées à l'inscription et pas encore enregistrées
      // (cas d'une confirmation d'e-mail différée).
      try {
        const raw = localStorage.getItem("TOH_profil_complement");
        if (raw) {
          const comp = JSON.parse(raw), maj = {};
          if (comp.date_naissance && !profil.date_naissance) maj.date_naissance = comp.date_naissance;
          if (comp.adresse && !profil.adresse) maj.adresse = comp.adresse;
          if (comp.telephone && !profil.telephone) maj.telephone = comp.telephone;
          if (Object.keys(maj).length) {
            const { error } = await sb.from("profils").update(maj).eq("id", profil.id);
            if (!error) Object.assign(profil, maj);
          }
          localStorage.removeItem("TOH_profil_complement");
        }
      } catch (_) {}

      const st = statutCotisation(profil);
      const estBureau = profil.role === "bureau";
      const estAssesseur = profil.type_adhesion === "Assesseur";
      const acces = aDroitAcces(profil);
      const jours = st.joursRestants;

      /* ---------- 1. Bonjour + statut ---------- */
      const pastille = estBureau
        ? '<span class="pastille bureau">Membre du bureau</span>'
        : (st.aJour ? '<span class="pastille ok">Adhérent actif</span>'
                    : '<span class="pastille ko">Cotisation à régler</span>');
      const ligneCoti = st.aJour
        ? `Cotisation à jour jusqu'au <strong>${st.echeance}</strong>.`
        : (estBureau ? "" : "Votre accès complet se débloque dès que le bureau aura validé votre cotisation.");

      /* ---------- 2. À faire ---------- */
      const aFaire = [];
      if (!st.aJour && !estBureau) aFaire.push({
        txt: "Votre adhésion attend la validation de votre cotisation par le bureau.",
        lien: "cotiser.html", libelle: "Régler ma cotisation", urgent: true });
      else if (jours != null && jours <= 60) aFaire.push({
        txt: `Votre cotisation arrive à échéance le ${st.echeance}` +
             (jours > 0 ? ` (dans ${jours} jour${jours > 1 ? "s" : ""}).` : "."),
        lien: "cotiser.html", libelle: "Renouveler", urgent: jours <= 30 });
      if (!profil.type_nuisance) aFaire.push({
        txt: "Votre profil est incomplet : indiquez le type de nuisance que vous subissez.",
        lien: "profil.html", libelle: "Compléter mon profil" });
      if (!profil.telephone) aFaire.push({
        txt: "Aucun téléphone enregistré : vous ne recevrez pas les SMS de l'association.",
        lien: "profil.html", libelle: "Ajouter mon téléphone" });

      const blocAFaire = aFaire.length ? `
        <section class="afaire ${aFaire.some(a => a.urgent) ? "urgent" : ""}">
          <h2>À faire</h2>
          <ul>${aFaire.map(a => `<li>
            <span class="txt">${a.txt}</span>
            <a href="${a.lien}" class="btn btn-primaire" style="padding:0.45rem 0.9rem;font-size:0.88rem">${a.libelle}</a>
          </li>`).join("")}</ul>
        </section>` : "";

      /* ---------- 3. Les actions ---------- */
      const lk = acces ? "" : "🔒 ";
      const cl = acces ? "" : " verrou";
      const action = (href, ico, titre, desc, extra) =>
        `<a class="action${extra || ""}" href="${href}">
           <span class="ico">${ico}</span><span><b>${titre}</b><span>${desc}</span></span></a>`;

      const actions = [
        action(acces ? "signaler.html" : "cotiser.html", "🔊", lk + "Signaler une nuisance",
               "Placez le bruit sur la carte : c'est le point de départ de tout dossier.", " signaler" + cl),
        action(acces ? "mes-signalements.html" : "cotiser.html", "📁", lk + "Mes dossiers",
               "Vos signalements, leur chronologie et leur état d'avancement.", cl),
        action(acces ? "outils.html" : "cotiser.html", "✍️", lk + "Mes démarches et courriers",
               "Générez vos courriers, tenez votre journal de bruit, suivez vos démarches.", cl),
        action("profil.html", "👤", "Mon profil",
               "Vos coordonnées, votre commune, la nuisance que vous subissez."),
        action("cotiser.html", "💳", "Ma cotisation",
               st.aJour ? "À jour jusqu'au " + st.echeance + "." : "Montant, moyens de paiement et suivi."),
        action(acces ? "annuaire.html" : "cotiser.html", "🤝", lk + "Annuaire et forum",
               "Retrouvez les adhérents de votre commune et échangez avec eux.", cl),
        action("guide-membre.html", "📄", "Mes documents",
               "Mode d'emploi, modèles de courriers, textes de loi."),
        action("contact.html", "💬", "Contacter Te Ora Hau",
               "Une question, un blocage ? Le bureau vous répond."),
      ];
      if (estAssesseur) actions.push(action("missions.html", "🎯", "Mes missions",
        "Les missions que le bureau confie aux assesseurs — les adhérents qui accompagnent leur secteur."));
      if (estBureau) actions.push(action("admin.html", "🏛️", "Administration",
        "Adhérents, cotisations, annonces, missions et rapports.", " bureau"));

      /* ---------- Assemblage ---------- */
      contenu.innerHTML = `
        <h1 class="bonjour">Bonjour ${echapper(profil.prenom || profil.nom || "")}</h1>
        <p class="statut">${pastille}${ligneCoti}</p>
        ${blocAFaire}
        <div class="actions">${actions.join("")}</div>
        <div id="annonces"></div>
        <section style="margin-top:1.6rem">
          <h2 class="titre-bloc">Ma carte de membre</h2>
          <div class="carte-membre">
            <div class="ligne">
              <div><div class="label">Membre</div><h3>${echapper(nomComplet(profil))}</h3></div>
              ${pastille.replace('class="pastille', 'class="badge-carte pastille')}
            </div>
            <div class="infos">
              <div>
                <div class="label">Commune</div><div class="val">${echapper(profil.commune) || "—"}</div>
                <div class="label" style="margin-top:0.5rem">Carte n°</div><div class="val">${st.numero}</div>
                <div class="label" style="margin-top:0.5rem">Période</div>
                <div class="val" style="font-size:0.85rem">${st.debutDate ? "du " + st.debut + " au " + st.echeance : "—"}</div>
              </div>
              <div id="qr"></div>
            </div>
          </div>
        </section>
        <section style="margin-top:1.6rem">
          <h2 class="titre-bloc">Notifications</h2>
          <p class="discret" id="notif-txt">Recevez une alerte quand l'association publie une annonce.</p>
          <button class="btn btn-clair" id="btn-notif" style="margin-top:0.5rem">Activer les notifications</button>
        </section>`;

      new QRCode(document.getElementById("qr"), {
        text: "TOH-MEMBRE:" + profil.id, width: 88, height: 88,
        colorDark: "#064a54", colorLight: "#ffffff",
      });

      /* ---------- Notifications ---------- */
      (function () {
        const btn = document.getElementById("btn-notif"), txt = document.getElementById("notif-txt");
        const refl = e => {
          if (e === "non-supporte") { btn.style.display = "none"; txt.textContent = "Les notifications ne sont pas disponibles sur cet appareil."; }
          else if (e === "non-configure") { btn.style.display = "none"; txt.textContent = "Les notifications ne sont pas encore configurées par l'association."; }
          else if (e === "refuse") { btn.style.display = "none"; txt.textContent = "Notifications bloquées par votre navigateur — réactivez-les dans ses réglages."; }
          else if (e === "actif") { btn.textContent = "Désactiver les notifications"; txt.textContent = "Notifications activées sur cet appareil."; }
          else { btn.textContent = "Activer les notifications"; txt.textContent = "Recevez une alerte quand l'association publie une annonce."; }
        };
        (async () => refl(await etatNotifications()))();
        btn.addEventListener("click", async () => {
          const rendre = boutonOccupe(btn, "…");
          const actif = (await etatNotifications()) === "actif";
          if (actif) await desactiverNotifications(); else await activerNotifications();
          rendre();
          refl(await etatNotifications());
        });
      })();

      /* ---------- Annonces de l'association ---------- */
      (async () => {
        const { data } = await sb.from("annonces").select("*").order("cree_le", { ascending: false });
        if (!data || !data.length) return;
        const maintenant = new Date();
        const vis = data.filter(an => {
          const okCible = estBureau || an.cible === "tous"
            || (an.cible === "ajour" && st.aJour) || (an.cible === "retard" && !st.aJour);
          if (!okCible) return false;
          if (an.date_evenement && new Date(an.date_evenement) < maintenant) return false;
          return true;
        });
        try {
          localStorage.setItem("TOH_vu_annonces", String(vis.length ? new Date(vis[0].cree_le).getTime() : Date.now()));
          rafraichirBadge(profil);
        } catch (_) {}
        if (!vis.length) return;
        document.getElementById("annonces").innerHTML =
          `<h2 class="titre-bloc">Annonces de l'association</h2>` +
          vis.slice(0, 5).map(an => {
            const evt = an.date_evenement ? new Date(an.date_evenement) : null;
            const aVenir = evt && evt >= maintenant;
            const evtTxt = evt ? `${evt.toLocaleDateString("fr-FR")} à ${evt.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : null;
            return `<div class="annonce ${aVenir ? "urgent" : ""}">
              <h4>${echapper(an.titre)}</h4>
              ${evtTxt ? `<div class="evt">Événement : ${evtTxt}</div>` : ""}
              <div class="corps">${echapper(an.corps)}</div>
              <div class="date">Publié le ${new Date(an.cree_le).toLocaleDateString("fr-FR")}</div>
            </div>`;
          }).join("");
      })();
    })();
  </script>
</body>
</html>
