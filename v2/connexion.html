<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion · Te Ora Hau</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Connectez-vous à votre espace adhérent Te Ora Hau : signalements, forum, outils et suivi de vos démarches contre le bruit.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://alaesbkvfprgpngrowbt.supabase.co" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-mount"></div>

  <main>
    <div class="form-wrap">
      <h1>Connexion membre</h1>
      <p class="intro">Accédez à votre espace, au forum et aux outils.</p>
      <div id="msg" class="message" role="status" aria-live="polite"></div>
      <form id="form-connexion">
        <div class="champ">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" required autocomplete="username"
                 autocapitalize="none" spellcheck="false" inputmode="email"
                 placeholder="vous@exemple.pf">
        </div>
        <div class="champ">
          <label for="mdp">Mot de passe</label>
          <input type="password" id="mdp" required autocomplete="current-password">
        </div>
        <button type="submit" id="btn-connexion" class="btn btn-primaire btn-bloc">Se connecter</button>
      </form>
      <p class="form-foot">
        <a href="mot-de-passe.html">Mot de passe oublié ?</a><br>
        Pas encore membre ? <a href="inscription.html">Adhérer</a>
      </p>
    </div>
  </main>

  <div id="footer-mount"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    initPage("connexion");
    const msg = document.getElementById("msg");
    const btnConnexion = document.getElementById("btn-connexion");
    // Œil « afficher / masquer » : on tape à l'aveugle sur téléphone sinon.
    oeilMotDePasse(document.getElementById("mdp"));

    document.getElementById("form-connexion").addEventListener("submit", async function(e) {
      e.preventDefault();
      if (envoiEnCours(e.target)) return;   // envoi déjà en cours (double clic / touche Entrée)
      if (!TOH_PRET) { montrer("err", "Le service est momentanément indisponible. Réessayez plus tard."); return; }
      const email = document.getElementById("email").value.trim();
      const mdp = document.getElementById("mdp").value;
      if (!email || !mdp) { montrer("err", "Merci de renseigner votre e-mail et votre mot de passe."); return; }

      // Bouton verrouillé pendant l'appel : plus de double soumission possible.
      const rendre = boutonOccupe(btnConnexion, "Connexion…");
      montrer("info", "Connexion…");
      const res = await connecter(email, mdp);
      rendre();
      montrer(res.ok ? "ok" : "err", res.msg);
      if (res.ok) setTimeout(() => location.href = "espace.html", 700);
    });
    function montrer(type, texte) { msg.className = "message " + type; msg.textContent = texte; }
  </script>
</body>
</html>
