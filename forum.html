<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum membres · Te Ora Hau</title>
  <!-- Page réservée aux membres : aucun intérêt dans les résultats de recherche. -->
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://alaesbkvfprgpngrowbt.supabase.co" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-mount"></div>

  <main id="contenu"></main>

  <div id="footer-mount"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async function() {
      await initPage("forum");
      const contenu = document.getElementById("contenu");
      const profil = await monProfil();

      const v = verrouAcces(profil);
      if (v) { contenu.innerHTML = v; return; }
      await dessiner();

      async function dessiner() {
        const { data: messages } = await sb.from("forum_messages")
          .select("*").order("cree_le", { ascending: false });
        // Marque le forum comme "lu" (efface la pastille / met à jour le badge d'icône).
        try { localStorage.setItem("TOH_vu_forum", String(messages && messages.length ? new Date(messages[0].cree_le).getTime() : Date.now())); } catch(_){}
        try { rafraichirBadge(profil); } catch(_){}
        const liste = (messages || []).map(m => `
          <div class="msg-forum">
            <div class="meta"><strong>${echapper(m.auteur_nom)}</strong> · ${new Date(m.cree_le).toLocaleString("fr-FR")}</div>
            <div>${echapper(m.texte)}</div>
          </div>`).join("") || "<p style='color:var(--gris)'>Aucun message pour le moment. Lancez la discussion !</p>";

        contenu.innerHTML = `
          <h2 class="section-titre">Forum des membres</h2>
          <p style="color:var(--gris);margin-bottom:1.4rem">Ia ora na ${echapper(nomComplet(profil))} — partagez vos situations et entraidez-vous.</p>
          <div class="form-wrap" style="max-width:100%;margin-bottom:2rem">
            <div id="msg-forum" class="message" role="status" aria-live="polite"></div>
            <form id="form-msg">
              <div class="champ">
                <label for="texte">Votre message</label>
                <textarea id="texte" rows="3" required placeholder="Décrivez votre situation, posez une question…"></textarea>
              </div>
              <button type="submit" class="btn btn-vert">Publier</button>
            </form>
          </div>
          <div id="liste-msg">${liste}</div>`;

        document.getElementById("form-msg").addEventListener("submit", async function(e) {
          e.preventDefault();
          if (envoiEnCours(e.target)) return;   // publication déjà en cours
          const zone = document.getElementById("msg-forum");
          const texte = document.getElementById("texte").value.trim();
          if (!texte) {
            zone.className = "message err";
            zone.textContent = "Votre message est vide.";
            return;
          }
          // Bouton verrouillé pendant la publication (plus de message en double),
          // et un échec d'enregistrement est désormais dit au lieu de disparaître.
          const erreur = await soumettre(e.target, "Publication…", async () => {
            const s = await sessionActive();
            if (!s) return { message: "Votre session a expiré. Reconnectez-vous pour publier." };
            const { error } = await sb.from("forum_messages")
              .insert({ auteur: s.user.id, auteur_nom: nomComplet(profil), texte });
            return error;
          });
          if (erreur) {
            zone.className = "message err";
            zone.textContent = messageErreur(erreur);
            return;   // le texte saisi reste dans le champ : rien n'est perdu
          }
          await dessiner();
        });
      }
    })();
  </script>
</body>
</html>
